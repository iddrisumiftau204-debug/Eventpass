services:
  # Express + SQLite API. Named explicitly so its public URL is predictable
  # (https://eventpass-api.onrender.com) and the frontend below can point at
  # it directly -- see DEPLOYMENT.md if Render assigns a different hostname
  # due to a name collision, and update the frontend's VITE_API_BASE_URL.
  - name: eventpass-api
    type: web
    runtime: node
    plan: starter # cheapest tier that supports an attached disk -- verify current plan names/pricing in the Render dashboard before deploying, see DEPLOYMENT.md
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: eventpass-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/eventpass.db

  # React (Vite) static build.
  - name: eventpass-web
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://eventpass-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
